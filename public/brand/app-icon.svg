
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <line x1="256" y1="46" x2="256" y2="466" stroke="#ffffff" stroke-opacity="0.5"
        stroke-width="6" stroke-dasharray="16 16" stroke-linecap="round"/>
  <g fill="#ffffff">
    <!-- head -->
    <circle cx="256" cy="126" r="42"/>
    <!-- torso: shoulders -> waist (rounded) -->
    <path d="M200 196
             Q256 176 312 196
             L300 300
             Q256 314 212 300 Z"/>
    <!-- arms -->
    <rect x="176" y="196" width="30" height="150" rx="15"/>
    <rect x="306" y="196" width="30" height="150" rx="15"/>
    <!-- legs -->
    <rect x="222" y="300" width="30" height="176" rx="15"/>
    <rect x="260" y="300" width="30" height="176" rx="15"/>
  </g>
  <!-- alignment joint dots on the plumb line -->
  <g fill="#0ea5e9" stroke="#ffffff" stroke-width="6">
    <circle cx="256" cy="196" r="13"/>
    <circle cx="256" cy="306" r="13"/>
  </g>
</svg>